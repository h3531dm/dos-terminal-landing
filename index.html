<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SYSTEM</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#000;
    color:#00ff00;
    font-family:"Courier New", monospace;
    overflow:hidden;
}

#screen{
    width:100%;
    height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    gap:20px;
}

.text{
    font-size:22px;
    letter-spacing:2px;
    animation:blink 1s infinite;
}

@keyframes blink{
    50%{
        opacity:0.4;
    }
}

button{
    background:#000;
    color:#00ff00;
    border:1px solid #00ff00;
    padding:14px 30px;
    font-size:18px;
    cursor:pointer;
    font-family:"Courier New", monospace;
    transition:.2s;
}

button:hover{
    background:#00ff00;
    color:#000;
}
</style>
</head>

<body>

<div id="screen">
    <div class="text">C:\SYSTEM&gt;</div>
    <button onclick="enterSystem()">ENTER</button>
</div>

<script>
function enterSystem(){
    window.location.href = "https://script.google.com/macros/s/AKfycbwRoYlOyjyJOXHsPXkL4dKgs8VH-5-6cctFubpkSux31pn9LfJ19FcyKaeskD16hpMF/exec";
}
</script>

</body>
</html>
