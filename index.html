<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DOS TERMINAL</title>

<style>
    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
    }

    body{
        background:#000;
        color:#00ff00;
        font-family:Courier New, monospace;
        overflow:hidden;
    }

    #terminal{
        padding:30px;
        height:100vh;
        overflow-y:auto;
        white-space:pre-line;
    }

    .cursor{
        display:inline-block;
        width:10px;
        background:#00ff00;
        animation:blink 1s infinite;
    }

    @keyframes blink{
        50%{
            opacity:0;
        }
    }

    button{
        margin-top:20px;
        background:#000;
        border:1px solid #00ff00;
        color:#00ff00;
        padding:15px 25px;
        font-size:18px;
        cursor:pointer;
        transition:0.3s;
    }

    button:hover{
        background:#00ff00;
        color:#000;
    }

    iframe{
        position:absolute;
        top:0;
        left:0;
        width:100%;
        height:100%;
        border:none;
        display:none;
    }
</style>
</head>

<body>

<div id="terminal"></div>

<iframe
id="appFrame"
src="https://script.google.com/macros/s/AKfycbwMb46VzI6L1AF1Rd6lR6Z7vNGKIBT9wfGRDbRcFY_KC5aeoB2jYFpZ5znnJJ-4Qpzy/exec">
</iframe>

<script>

const terminal = document.getElementById("terminal");

const lines = [
"Microsoft(R) DOS v6.22",
"",
"Inicializando sistema...",
"",
"Conectando ao servidor...",
"",
"Autenticando acesso...",
"",
"ACCESS GRANTED",
"",
"Sistema operacional carregado.",
"",
"> Clique abaixo para entrar"
];

let index = 0;

function typeLine(){

    if(index < lines.length){

        terminal.innerHTML += lines[index] + "\n";
        index++;

        setTimeout(typeLine, 500);

    }else{

        const btn = document.createElement("button");

        btn.innerText = "ENTER SYSTEM";

        btn.onclick = () => {

            document.getElementById("terminal").style.display = "none";

            document.getElementById("appFrame").style.display = "block";
        };

        terminal.appendChild(btn);

        const cursor = document.createElement("span");
        cursor.className = "cursor";

        terminal.appendChild(cursor);
    }
}

typeLine();

</script>

</body>
</html>
